name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content version.txt).Trim()
          $ver = "$base.${{ github.run_number }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $prerelease = "true"
          } else {
            $prerelease = "false"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "PRERELEASE=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Publish app (builds frontend + .NET)
        working-directory: app
        run: dotnet publish -c Release -r win-x64 --self-contained -o ../publish

      - name: Install Inno Setup
        run: winget install JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Update installer version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer\DevelopmentHub.iss) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer\DevelopmentHub.iss

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          & $iscc installer\DevelopmentHub.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: DevelopmentHub v${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
          files: installer/output/DevelopmentHub-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
