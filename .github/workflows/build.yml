name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content version.txt).Trim()
          if ("${{ github.event_name }}" -eq "pull_request") {
            $ver = "$base.${{ github.run_number }}-pr${{ github.event.number }}"
          } else {
            $ver = "$base.${{ github.run_number }}"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Publish app (builds frontend + .NET)
        working-directory: app
        run: dotnet publish -c Release -r win-x64 --self-contained -o ../publish

      - name: Update Edge extension version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $manifestPath = "edge-extension/manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath

      - name: Package Edge extension
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $staging = "edge-extension-dist"
          $zipPath = "artifacts/DevelopmentHub-Edge-Extension-$version.zip"

          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }

          New-Item -ItemType Directory -Path $staging | Out-Null
          New-Item -ItemType Directory -Path "artifacts" | Out-Null

          Copy-Item "edge-extension/*" $staging -Recurse
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Update installer version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer\DevelopmentHub.iss) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer\DevelopmentHub.iss

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\DevelopmentHub.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentHub-Setup-${{ steps.version.outputs.VERSION }}
          path: installer/output/DevelopmentHub-Setup-*.exe
          retention-days: 14

      - name: Upload Edge extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentHub-Edge-Extension-${{ steps.version.outputs.VERSION }}
          path: artifacts/DevelopmentHub-Edge-Extension-*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: DevelopmentHub v${{ steps.version.outputs.VERSION }}
          prerelease: false
          generate_release_notes: true
          files: |
            installer/output/DevelopmentHub-Setup-*.exe
            artifacts/DevelopmentHub-Edge-Extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
