name: Build & Release

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r '.["."]' .release-please-manifest.json)-ci"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Run frontend tests
        working-directory: src/web
        run: npm test

      - name: Run backend tests
        run: dotnet test src/tests/DevelopmentHub.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Publish app (builds frontend + .NET)
        working-directory: src/app
        run: dotnet publish -c Release -r win-x64 --self-contained -o ../../publish

      - name: Update Edge extension version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $manifestPath = "src/browser-extension/manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath

      - name: Package Edge extension
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $staging = "edge-extension-dist"
          $zipPath = "artifacts/DevelopmentHub-Edge-Extension-$version.zip"

          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }

          New-Item -ItemType Directory -Path $staging | Out-Null
          New-Item -ItemType Directory -Path "artifacts" | Out-Null

          Copy-Item "src/browser-extension/*" $staging -Recurse
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath

      - name: Pack plugin SDK (NuGet)
        shell: bash
        run: |
          dotnet pack src/plugins/DevelopmentHub.Plugins.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o artifacts/nuget

      - name: Pack plugin SDK (npm)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pkgPath = "src/web/src/plugin-sdk/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath
          New-Item -ItemType Directory -Path "artifacts/npm" -Force | Out-Null
          npm pack src/web/src/plugin-sdk --pack-destination artifacts/npm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Update installer version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          (Get-Content src\installer\DevelopmentHub.iss) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content src\installer\DevelopmentHub.iss

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc src\installer\DevelopmentHub.iss

      - name: Upload artifacts (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentHub-${{ steps.version.outputs.version }}
          path: |
            src/installer/output/DevelopmentHub-Setup-*.exe
            artifacts/DevelopmentHub-Edge-Extension-*.zip
            artifacts/nuget/*.nupkg
            artifacts/npm/*.tgz
          retention-days: 1

      - name: Upload release assets
        if: github.event_name == 'release'
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            src/installer/output/DevelopmentHub-Setup-*.exe \
            artifacts/DevelopmentHub-Edge-Extension-*.zip \
            artifacts/nuget/*.nupkg \
            artifacts/npm/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
