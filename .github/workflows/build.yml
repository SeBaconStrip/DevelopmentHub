name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        shell: bash
        run: |
          git fetch --tags --force
          echo "Available tags:"
          git tag --list | sort -V

      - name: Calculate version
        id: calc
        shell: bash
        run: |
          # Read major.minor from VERSION file
          MAJOR_MINOR=$(cat version.txt | tr -d '[:space:]')
          echo "Major.Minor: $MAJOR_MINOR"

          # Find all tags matching major.minor.* and get the highest patch
          # Strip optional -ci suffix so both release and ci tags are considered
          LAST_PATCH=$(git tag --list "${MAJOR_MINOR}.*" \
            | sed "s/^${MAJOR_MINOR}\.//" \
            | sed 's/-ci$//' \
            | { grep -E '^[0-9]+$' || true; } \
            | sort -n \
            | tail -1)

          if [ -z "$LAST_PATCH" ]; then
            # No existing tag for this major.minor → start at 0
            PATCH=0
          else
            PATCH=$((LAST_PATCH + 1))
          fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${VERSION}-ci"
          fi
          echo "Calculated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Create Git tag
        shell: bash
        run: |
          VERSION="${{ steps.calc.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Publish app (builds frontend + .NET)
        working-directory: src/app
        run: dotnet publish -c Release -r win-x64 --self-contained -o ../../publish

      - name: Update Edge extension version
        shell: pwsh
        run: |
          $version = "${{ steps.calc.outputs.version }}"
          $manifestPath = "ext/manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath

      - name: Package Edge extension
        shell: pwsh
        run: |
          $version = "${{ steps.calc.outputs.version }}"
          $staging = "edge-extension-dist"
          $zipPath = "artifacts/DevelopmentHub-Edge-Extension-$version.zip"

          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }

          New-Item -ItemType Directory -Path $staging | Out-Null
          New-Item -ItemType Directory -Path "artifacts" | Out-Null

          Copy-Item "ext/*" $staging -Recurse
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Update installer version
        shell: pwsh
        run: |
          $ver = "${{ steps.calc.outputs.version }}"
          (Get-Content installer\DevelopmentHub.iss) `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer\DevelopmentHub.iss

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\DevelopmentHub.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentHub-Setup-${{ steps.calc.outputs.version }}
          path: installer/output/DevelopmentHub-Setup-*.exe
          retention-days: 14

      - name: Upload Edge extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentHub-Edge-Extension-${{ steps.calc.outputs.version }}
          path: artifacts/DevelopmentHub-Edge-Extension-*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.calc.outputs.version }}
          name: DevelopmentHub v${{ steps.calc.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: |
            installer/output/DevelopmentHub-Setup-*.exe
            artifacts/DevelopmentHub-Edge-Extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
